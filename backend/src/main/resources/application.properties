# ===================================================================
# ElectraLab Backend Configuration
# ===================================================================

# Application Information
spring.application.name=ElectraLab

# Server Port (uses cloud PORT if present, defaults to 8081 locally)
server.port=${PORT:8081}

# Optional local properties import (ignored by git, loads credentials if present)
spring.config.import=optional:classpath:application-local.properties

# Aiven MySQL Datasource Configuration (via Environment Variables)
spring.datasource.url=${DB_URL:jdbc:mysql://saiteja-anurag-1381.b.aivencloud.com:20679/defaultdb?sslMode=REQUIRED}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# HikariCP Connection Pool Settings (Optimized for cloud database quotas)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=-1
